name: Render X assets

on:
  push:
    branches:
      - assets/x-profile
    paths:
      - "social/**"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets/x-profile

      - name: Install renderer
        run: python -m pip install --quiet cairosvg

      - name: Render banner and copy exact logo
        run: |
          python - <<'PY'
          import cairosvg, shutil
          cairosvg.svg2png(
              url="social/mentorandi-x-banner.svg",
              write_to="social/mentorandi-x-banner.png",
              output_width=1500,
              output_height=500,
          )
          shutil.copyfile(
              "images/MentorAndIlogo.png",
              "social/MentorAndIlogo-original.png",
          )
          PY

      - name: Commit rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/mentorandi-x-banner.png social/MentorAndIlogo-original.png
          if git diff --cached --quiet; then
            echo "No rendered asset changes."
            exit 0
          fi
          git commit -m "Render X profile assets"
          git push origin HEAD:assets/x-profile
