name: One-time fix Start free links

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-fix-start-free.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Replace redundant Start free anchors
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'href="#start"'
          new = 'href="https://app.mentorandi.com/signup?plan=free"'
          count = s.count(old)
          if count != 3:
              raise SystemExit(f'Expected exactly 3 #start links, found {count}')
          p.write_text(s.replace(old, new))
          PY
          rm .github/workflows/one-time-fix-start-free.yml
          git config user.name "MentorAndI"
          git config user.email "37156918+MentorAndI@users.noreply.github.com"
          git add index.html .github/workflows/one-time-fix-start-free.yml
          git commit -m "Send Start free CTAs directly to signup"
          git push origin HEAD:main
