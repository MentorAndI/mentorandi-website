name: One-time launch legal synchronization v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-launch-legal-sync-v2.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Synchronize launch legal copy and signup links
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          signup = "https://app.mentorandi.com/signup?plan=free"
          for pattern in ("*.html", "*.php"):
              for path in Path(".").rglob(pattern):
                  text = path.read_text(encoding="utf-8")
                  updated = text.replace('/index.html#start', signup)
                  if updated != text:
                      path.write_text(updated, encoding="utf-8")

          safety = Path("ai-safety.html")
          text = safety.read_text(encoding="utf-8")
          text = text.replace("Last updated: 13 August 2026", "Last updated: 25 August 2026")
          old = '''<h2>2. What is in place today</h2>
          <p>We would rather describe less than we have than more, so this section covers only what the service actually does at the time of writing.</p>
          <p>Mentor And I gives every mentor a standing instruction not to present itself as a substitute for medical or emergency professionals. Where a conversation shows signs of immediate danger or self-harm, that instruction directs the mentor to encourage the person to contact local emergency services or qualified human support.</p>
          <p>This is guidance given to a language model. It shapes how a mentor is likely to respond; it does not guarantee how a mentor will respond in every case.</p>

          <h2>3. What is not in place yet</h2>
          <p>Mentor And I does <strong>not</strong> currently have:</p>
          <ul>
          <li>an automated system that detects language indicating suicidal ideation or self-harm;</li>
          <li>risk classification of conversations;</li>
          <li>a deterministic override that interrupts the normal mentoring flow when a safety concern appears; or</li>
          <li>a dedicated crisis-handling path separate from ordinary mentoring.</li>
          </ul>
          <p>These safeguards are under development. We will describe them here once they are implemented and tested, and not before. We would rather this page be uncomfortably plain than reassuring and wrong.</p>

          <h2>4. What this means for you</h2>
          <p>Do not rely on Mentor And I to notice that you are in danger. It may not.</p>
          <p>Do not delay contacting a doctor, a crisis line or emergency services because of anything a mentor has said. If a conversation is heading somewhere that needs a human, please reach one.</p>
          <p>Mentor And I is not continuously monitored by a human professional, and messages sent through it are not read in real time.</p>'''.replace("          ", "")
          new = '''<h2>2. What is in place today</h2>
          <p>We would rather describe less than we have than more, so this section covers only safeguards that are implemented and tested today.</p>
          <p>Before an ordinary mentor response is generated, Mentor And I runs a separate automated safety check for language indicating self-harm, suicide or immediate danger. The safety layer classifies the message independently of the mentor persona.</p>
          <p>When the system classifies a message as high risk, it interrupts the normal mentoring flow and returns a deterministic safety response that directs the user toward immediate human or emergency support. The high-risk message is not sent to the ordinary mentor language-model response path and the safety response does not consume mentor credits.</p>
          <p>The safety layer is designed to fail closed: a failure in the safety classifier does not simply allow the normal mentor response to proceed. Safety regression tests are part of the application launch checks.</p>

          <h2>3. Limits of the safety layer</h2>
          <p>Automated safety systems are imperfect. The classifier can miss genuine danger, can react to language that was not intended as a crisis statement, and cannot determine a person's actual clinical risk or circumstances.</p>
          <p>The safety layer is not human monitoring, diagnosis, treatment or emergency response. Mentor And I does not guarantee that every crisis will be detected or handled correctly.</p>

          <h2>4. What this means for you</h2>
          <p>Do not rely on Mentor And I as your only way to identify or respond to an emergency. If you believe that you or another person may be in immediate danger, contact local emergency services or qualified human support directly.</p>
          <p>Do not delay contacting a doctor, crisis service or emergency service because of anything a mentor has said.</p>
          <p>Mentor And I is not continuously monitored by a human professional, and messages sent through it are not read in real time.</p>'''.replace("          ", "")
          if old not in text:
              raise SystemExit("Expected AI Safety pre-Feature-114 block not found")
          safety.write_text(text.replace(old, new), encoding="utf-8")

          terms = Path("terms.html")
          text = terms.read_text(encoding="utf-8").replace("Last updated: 13 August 2026", "Last updated: 25 August 2026")
          old_crisis = '''<p>Mentor And I instructs its mentors not to present themselves as a substitute for medical or emergency professionals, and to encourage you to contact local emergency services or qualified human support where there are signs of immediate danger or self-harm.</p>
          <p>These are instructions given to a language model, not a guaranteed detection system. Mentor And I does not guarantee that it will recognise or respond appropriately to every expression of crisis. Further technical safeguards are described on our <a href="/ai-safety.html">AI Safety</a> page.</p>'''.replace("          ", "")
          new_crisis = '''<p>Mentor And I uses a separate automated safety layer before ordinary mentor responses to identify certain language indicating self-harm, suicide or immediate danger. A high-risk classification interrupts the normal mentoring response path and returns a dedicated safety response directing the user toward immediate human or emergency support.</p>
          <p>No automated classifier is perfect. Mentor And I does not guarantee that it will recognise or respond appropriately to every expression of crisis, and the service remains neither human-monitored nor an emergency service. Further details are described on our <a href="/ai-safety.html">AI Safety</a> page.</p>'''.replace("          ", "")
          if old_crisis not in text:
              raise SystemExit("Expected Terms crisis block not found")
          text = text.replace(old_crisis, new_crisis)
          old_payments = '''<h2>13. Subscriptions and payments</h2>
          <p>Some features may in the future require a paid subscription, credits or another paid plan.</p>
          <p>Where paid services are offered, the applicable price, billing period and material restrictions will be shown before purchase. Additional payment and cancellation terms may apply at that time.</p>
          <p>No statement on the current website should be interpreted as a guarantee that a planned price or plan will remain unchanged before commercial launch.</p>'''.replace("          ", "")
          new_payments = '''<h2>13. Subscriptions and payments</h2>
          <p>Mentor And I offers free and paid access. Paid plans may include recurring subscriptions and included mentor credits, and users may be able to purchase additional credit packs.</p>
          <p>The applicable price, billing period, included credits and material restrictions are shown before purchase. Subscriptions renew according to the billing terms shown at checkout until cancelled, and account billing controls may be provided through our payment provider.</p>
          <p>Prices, plan features and credit allocations may change prospectively. Any change affecting an existing subscription will be handled in accordance with applicable law and the terms presented to the user.</p>'''.replace("          ", "")
          if old_payments not in text:
              raise SystemExit("Expected Terms pre-launch payment block not found")
          terms.write_text(text.replace(old_payments, new_payments), encoding="utf-8")
          PY
      - name: Commit synchronized launch pages
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/one-time-launch-legal-sync.yml .github/workflows/one-time-launch-legal-sync-v2.yml
          git config user.name "Mentor247"
          git config user.email "37156918+MentorAndI@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize public legal pages with launch runtime"
          git push origin HEAD:main
