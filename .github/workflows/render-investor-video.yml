name: Render investor film

on:
  push:
    branches:
      - feature/investor-video-v1
    paths-ignore:
      - "investor-video/out/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: investor-video

    steps:
      - name: Check out film branch
        uses: actions/checkout@v4
        with:
          ref: feature/investor-video-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Render MP4
        run: npm run render

      - name: Render poster
        run: npm run poster

      - name: Upload rendered preview
        uses: actions/upload-artifact@v4
        with:
          name: mentor-and-i-investor-film-v1
          path: |
            investor-video/out/mentor-and-i-investor-film.mp4
            investor-video/out/mentor-and-i-investor-poster.png
          retention-days: 30

      - name: Commit rendered files
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add investor-video/out/mentor-and-i-investor-film.mp4 investor-video/out/mentor-and-i-investor-poster.png investor-video/package-lock.json
          if git diff --cached --quiet; then
            echo "No render changes."
            exit 0
          fi
          git commit -m "Render investor film v1"
          git pull --rebase origin feature/investor-video-v1
          git push origin HEAD:feature/investor-video-v1
