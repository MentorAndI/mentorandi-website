name: One-time launch legal copy polish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-launch-copy-polish.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Remove remaining pre-launch wording
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          safety = Path("ai-safety.html")
          text = safety.read_text(encoding="utf-8")
          text = text.replace(
              "How Mentor And I handles conversations involving suicide, self-harm or immediate danger — what safeguards exist today, and what does not yet.",
              "How Mentor And I handles conversations involving suicide, self-harm or immediate danger — the automated safeguards in place today and their limits.",
          )
          text = text.replace(
              "This page explains what safeguards are in place when a conversation involves suicide, self-harm or immediate danger — and, just as importantly, what is not in place yet.",
              "This page explains the automated safeguards in place when a conversation involves suicide, self-harm or immediate danger — and, just as importantly, their limits.",
          )
          safety.write_text(text, encoding="utf-8")

          terms = Path("terms.html")
          text = terms.read_text(encoding="utf-8")
          text = text.replace(
              "<p>During alpha or beta testing, users should expect product changes and occasional errors.</p>",
              "<p>Because the service is under active development, users should expect product changes and occasional errors.</p>",
          )
          terms.write_text(text, encoding="utf-8")
          PY
      - name: Commit launch copy polish
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/one-time-launch-copy-polish.yml
          git config user.name "Mentor247"
          git config user.email "37156918+MentorAndI@users.noreply.github.com"
          git add -A
          git commit -m "Remove remaining pre-launch legal wording"
          git push origin HEAD:main
