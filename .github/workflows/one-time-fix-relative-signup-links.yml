name: One-time relative signup link repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-fix-relative-signup-links.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Repair and verify signup links
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          signup = "https://app.mentorandi.com/signup?plan=free"
          malformed = re.compile(r"(?:\.\./)*\.\.https://app\.mentorandi\.com/signup\?plan=free")

          files = []
          for pattern in ("*.html", "*.php"):
              files.extend(Path(".").rglob(pattern))

          for path in files:
              text = path.read_text(encoding="utf-8")
              updated = malformed.sub(signup, text)
              # Catch any old relative or root homepage Start-free target as well.
              updated = re.sub(r"(?:\.\./)*/?index\.html#start", signup, updated)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          failures = []
          for path in files:
              text = path.read_text(encoding="utf-8")
              if "index.html#start" in text or "..https://app.mentorandi.com" in text:
                  failures.append(str(path))
          if failures:
              raise SystemExit("Invalid Start-free links remain in: " + ", ".join(failures))
          PY
      - name: Commit repaired links
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/one-time-fix-relative-signup-links.yml
          git config user.name "Mentor247"
          git config user.email "37156918+MentorAndI@users.noreply.github.com"
          git add -A
          git commit -m "Repair relative Start free links"
          git push origin HEAD:main
